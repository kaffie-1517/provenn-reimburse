# Local infrastructure only. The api and worker run natively (make api / make worker).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: provenn
      POSTGRES_PASSWORD: provenn
      POSTGRES_DB: provenn
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U provenn -d provenn
      interval: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: provenn
      MINIO_ROOT_PASSWORD: provenn-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [objects:/data]
    healthcheck:
      test: mc ready local
      interval: 3s
      retries: 10

  bucket:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "mc alias set s3 http://minio:9000 provenn provenn-secret && mc mb -p s3/provenn"]

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pg:
  objects:
  prom:
  grafana:
