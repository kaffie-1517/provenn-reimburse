[project]
name = "provenn"
version = "0.1.0"
description = "Tamper-evident invoices for expense reimbursement"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
